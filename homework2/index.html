<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁置中範例</title>
    <!-- 這裡連結你的 CSS 檔案，例如：<link rel="stylesheet" href="style.css"> -->
</head>
<body>

    <!-- 🌟 包裹層：確保頁首和照片完美置中並連動 -->
    <div class="header-wrapper">
        <!-- 頁首區塊 -->
        <header class="main-header">
            <div class="header-title">FTDBLUEMOOD</div>
            <div class="header-slogan">SMALL COMPANY SLOGAN GOES HERE</div>
        </header>

        <!-- 🌟 照片本體（請把 src="your-photo-name.jpg" 換成你實際的照片檔名或路徑） -->
        <img src="your-photo-name.jpg" alt="Banner" class="banner-photo">
    </div>

    <!-- 導覽列 -->
    <nav class="navbar">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- 主體內容區 -->
    <div class="container">
        <!-- 上排三欄 -->
        <div class="top-row">
            <div class="card">
                <h3>Your Options</h3>
                <p>文字內容...</p>
            </div>
            <div class="card">
                <h3>Company News</h3>
                <p>文字內容...</p>
            </div>
            <div class="card">
                <h3>Have a Question?</h3>
                <p>文字內容...</p>
            </div>
        </div>

        <!-- 下排雙欄 -->
        <div class="middle-row">
            <div class="left-col-60">
                <h2>Etiam felis ipsum</h2>
                <p>描述文字...</p>
            </div>
            <div class="right-col-40">
                <h3>Duis blandit ultrices</h3>
                <ul>
                    <li><a href="#">DONEC TINCIDUNT PURUS VITAE</a></li>
                </ul>
            </div>
        </div>
    </div>

</body>
</html>
